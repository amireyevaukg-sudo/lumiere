<!DOCTYPE html>
<html lang="ru" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUMIÈRE — дизайнерское освещение</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f0e8;--bg2:#ebe5d9;--ink:#1d1d1f;--mute:#6b6862;--line:#d9d2c3;--gold:#a8853f;--dark:#232325;--darkink:#f4f0e8;color-scheme:light;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171718;--bg2:#202022;--ink:#efeae0;--mute:#a09b90;--line:#38383b;--gold:#c9a45c;--dark:#0e0e0f;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.6 var(--sans)}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.1;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.demo{background:var(--dark);color:var(--darkink);font-size:13px;text-align:center;padding:7px 12px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 5vw}
.logo{font-family:var(--serif);font-size:28px;letter-spacing:.14em;font-weight:500}
nav{display:flex;gap:26px;align-items:center}
nav a{font-size:15px;color:var(--mute)}nav a:hover{color:var(--ink)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:12px 24px;font-size:15px;letter-spacing:.03em;transition:.2s}
.btn:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{min-height:60vh}
.wrap{padding:0 5vw}
.hero{background:var(--dark);color:var(--darkink);display:grid;grid-template-columns:1.1fr 1fr;align-items:center;min-height:78vh;overflow:hidden}
.hero .t{padding:8vw 5vw}
.hero h1{font-size:clamp(44px,6.5vw,92px);font-weight:400}
.hero p{max-width:440px;color:#b9b3a6;margin:22px 0 34px;font-size:17px}
.hero .btn{background:var(--gold);border-color:var(--gold);color:#fff}
.hero .btn.ghost{background:transparent;color:var(--darkink);border-color:#5a5852;margin-left:10px}
.hero .art{height:100%;min-height:380px;position:relative;overflow:hidden;background:#161412}
.hero .art svg{width:100%;height:100%}
.sec{padding:84px 5vw 20px}
.sec h2{font-size:clamp(32px,4vw,52px);margin-bottom:10px}
.sec .sub{color:var(--mute);max-width:520px;margin:0 0 36px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:28px 22px}
.card{display:block}
.card .img{aspect-ratio:4/5;background:var(--bg2);overflow:hidden}
.card .img svg{width:100%;height:100%;display:block;transition:transform .5s}
.card:hover .img svg{transform:scale(1.04)}
.card h3{font-size:24px;margin-top:14px}
.card .m{color:var(--mute);font-size:14px}
.card .p{margin-top:2px;font-weight:400}
.band{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin:84px 5vw 0;padding:40px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.band h3{font-size:24px;margin-bottom:6px}.band p{margin:0;color:var(--mute);font-size:15px}
.cta{background:var(--bg2);margin-top:84px;padding:80px 5vw;text-align:center}
.cta h2{font-size:clamp(30px,4vw,48px);margin-bottom:12px}.cta p{color:var(--mute);margin:0 auto 28px;max-width:460px}
.cat{display:grid;grid-template-columns:230px 1fr;gap:44px;padding:44px 5vw 0}
.cat>div>h1{font-size:clamp(38px,5vw,60px);margin-bottom:26px}
.fl h4{font:500 14px var(--sans);margin:0 0 10px}
.fl .g{margin-bottom:26px;display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;border:1px solid #8886}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;color:var(--mute);font-size:14px}
select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:7px 10px}
.empty{padding:50px 0;color:var(--mute)}
.prod{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;padding:36px 5vw 0}
.prod .img{background:var(--bg2);aspect-ratio:1/1.05}
.prod .img svg{width:100%;height:100%;display:block}
.prod h1{font-size:clamp(38px,5vw,62px);margin:8px 0 6px}
.prod .price{font:500 26px var(--serif);margin:12px 0 18px}
.crumb{font-size:14px;color:var(--mute)}.crumb a:hover{color:var(--ink)}
.spec{border-top:1px solid var(--line);margin:26px 0;padding:0}
.spec div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.spec span:first-child{color:var(--mute)}
footer{margin-top:90px;background:var(--dark);color:#b9b3a6;padding:50px 5vw;display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap;font-size:14px}
footer .logo{color:var(--darkink)}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:18px}
.ov.on{display:flex}
.modal{background:var(--bg);width:100%;max-width:440px;padding:36px 30px;position:relative;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(12px)}}
.modal h2{font-size:32px;margin-bottom:6px}
.modal p{color:var(--mute);margin:0 0 20px;font-size:15px}
.x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:28px;color:var(--mute)}
label{display:block;font-size:14px;margin:14px 0 6px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
.err{color:#b3402f;font-size:13px;min-height:18px;margin-top:4px}
.modal .btn{width:100%;margin-top:18px}
.card .img img,.prod .img img{width:100%;height:100%;object-fit:cover;display:block}
.wa{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;background:#1f6f4a;color:#fff;padding:13px 20px;font-size:15px;border-radius:30px;box-shadow:0 6px 20px #0004}
.tb{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.tb img{width:70px;height:70px;object-fit:cover;cursor:pointer;border:1px solid var(--line)}
textarea,select.f{width:100%;font:inherit;padding:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink)}
.adm{padding:40px 5vw;max-width:880px}.adm h1{font-size:clamp(36px,5vw,56px)}.adm .sub{color:var(--mute)}
.ar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.at{display:flex;gap:14px;align-items:center}.th{width:56px;height:70px;flex:none;background:var(--bg2);overflow:hidden}.th svg,.th img{width:100%;height:100%;object-fit:cover;display:block}
.ah{display:flex;justify-content:space-between;align-items:center;margin:40px 0 10px}
.fm2{background:var(--bg2);padding:20px;margin:14px 0 24px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.pt{position:relative;width:70px;height:88px}.pt img{width:100%;height:100%;object-fit:cover}.pt button{position:absolute;top:0;right:0;border:0;background:#000a;color:#fff;width:24px;height:24px;padding:0}
.ok{color:#2e7d4f;font-size:14px}
.sc .lt{opacity:0;transition:opacity 1.2s ease}.sc.on .lt{opacity:1}
.sc .dk{transition:opacity 1.2s ease}.sc.on .dk{opacity:0}
.sw2{position:absolute;left:20px;bottom:20px;background:#0009;color:#f4f0e8;border:1px solid #fff5;padding:10px 18px;font-size:14px;backdrop-filter:blur(6px)}
.sw2:hover{background:var(--gold);border-color:var(--gold)}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.2s infinite}@keyframes pu{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:820px){
nav a.l{display:none}
.hero,.prod,.cat{grid-template-columns:1fr}
.hero .art{min-height:460px;order:-1}.hero .t{padding:36px 6vw 50px}
.hero .btn.ghost{margin:10px 0 0}
.band{grid-template-columns:1fr}
.cat{gap:10px}.sec{padding-top:56px}.prod{gap:24px}
}
</style>
